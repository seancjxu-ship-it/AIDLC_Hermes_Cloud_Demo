apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aidlc-deploy-worker
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aidlc-deploy-worker
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aidlc-deploy-worker
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: aidlc-deploy-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aidlc-deploy-worker
---
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: aidlc-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AIDLC_DEMO_USERNAME: {{ .Values.secrets.demoUsername | quote }}
  AIDLC_DEMO_PASSWORD: {{ .Values.secrets.demoPassword | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  MAAS_API_KEY: {{ .Values.secrets.maasApiKey | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aidlc-config
  namespace: {{ .Release.Namespace }}
data:
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  GITHUB_REPO_URL: {{ .Values.config.repositoryUrl | quote }}
  GITHUB_DEFAULT_BRANCH: {{ .Values.config.defaultBranch | quote }}
  AIDLC_GITHUB_WRITE: {{ .Values.config.githubWrite | quote }}
  MAAS_BASE_URL: {{ .Values.config.maasBaseUrl | quote }}
  MAAS_MODEL: {{ .Values.config.maasModel | quote }}
  SWR_IMAGE_REPO: {{ .Values.config.swrImageRepo | quote }}
  AIDLC_RUNTIME_IMAGE: {{ .Values.config.runtimeImage | quote }}
  AIDLC_K8S_NAMESPACE: {{ .Values.config.kubernetesNamespace | quote }}
  AIDLC_IMAGE_PULL_SECRET: {{ .Values.config.imagePullSecret | quote }}
  AIDLC_KANIKO_IMAGE: {{ .Values.config.kanikoImage | quote }}
  AIDLC_PREVIEW_PORT: {{ .Values.config.previewPort | quote }}
  AIDLC_BUILD_TIMEOUT: {{ .Values.config.buildTimeout | quote }}
  AIDLC_DEPLOY_TIMEOUT: {{ .Values.config.deployTimeout | quote }}
  AIDLC_ALLOW_DEMO_SCAFFOLD: "true"
  AIDLC_ALLOW_FALLBACK: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidlc-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: aidlc-api}
  template:
    metadata:
      labels: {app: aidlc-api, component: entry-point}
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          envFrom:
            - configMapRef: {name: aidlc-config}
            - secretRef: {name: aidlc-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aidlc-api
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: aidlc-api}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-orchestrator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hermes-orchestrator}
  template:
    metadata:
      labels: {app: hermes-orchestrator, component: control-plane}
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["orchestrator"]
          envFrom:
            - configMapRef: {name: aidlc-config}
            - secretRef: {name: aidlc-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
{{- range $role := list "dev" "qa" "review" "deploy" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-sf-{{ $role }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hermes-sf-{{ $role }}}
  template:
    metadata:
      labels: {app: hermes-sf-{{ $role }}, component: agent-worker, role: {{ $role }}}
    spec:
      {{- if eq $role "deploy" }}
      serviceAccountName: aidlc-deploy-worker
      {{- end }}
      imagePullSecrets: {{ toYaml $.Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: worker
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["worker", "{{ $role }}"]
          envFrom:
            - configMapRef: {name: aidlc-config}
            - secretRef: {name: aidlc-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 750m, memory: 768Mi}
---
{{- end }}
