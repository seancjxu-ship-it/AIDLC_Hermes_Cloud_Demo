  kubernetesNamespace: aidlc-demo
  imagePullSecret: swr-pull
  kanikoImage: gcr.io/kaniko-project/executor:v1.23.2-debug
  previewPort: "8080"
  buildTimeout: "900"
  deployTimeout: "300"
  taskTimeout: "600"
  previewRetention: "2"
  githubWrite: "true"
secrets:
  create: true
  demoUsername: demo
  demoPassword: ""
  githubToken: ""
  maasApiKey: ""
