image:
  repository: swr.sa-brazil-1.myhuaweicloud.com/aidlc-demo/aidlc-factory
  tag: "3.0.0"
  pullPolicy: Always
imagePullSecrets:
  - name: swr-pull
service:
  type: NodePort
  port: 8000
  nodePort: 30080
config:
  redisUrl: ""
  repositoryUrl: https://github.com/seancjxu-ship-it/AIDLC_Simple_Order_Demo
  defaultBranch: main
  maasBaseUrl: https://api-ap-southeast-1.modelarts-maas.com/openai/v1
