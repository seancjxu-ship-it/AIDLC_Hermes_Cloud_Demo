apiVersion: v1
kind: ServiceAccount
metadata:
  name: aidlc-deploy-worker
  namespace: aidlc-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aidlc-deploy-worker
  namespace: aidlc-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aidlc-deploy-worker
  namespace: aidlc-demo
subjects:
  - kind: ServiceAccount
    name: aidlc-deploy-worker
    namespace: aidlc-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aidlc-deploy-worker
